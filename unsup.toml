# creative flavour

[flavor_groups.creative]
name = "Creative Mode"
description = "Creative building tweaks to the modpack."
side = "client"

[[flavor_groups.creative.choices]]
id = "creative_mode_off"
name = "Off (Recommended)"
description = "Normal non-creative mode flavour."

[[flavor_groups.creative.choices]]
id = "creative_mode_on"
name = "On"
description = "Installs Axiom and disables world gen mods for superflat to work properly."

# metafiles

# -- creative on

[metafile.axiom]
flavors = "creative_mode_on"

# -- creative off

[metafile.terralith]
flavors = "creative_mode_off"

[metafile.remove-terralith-intro-message]
flavors = "creative_mode_off"

[metafile.terralith-no-structures]
flavors = "creative_mode_off"
